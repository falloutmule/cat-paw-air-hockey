name: canonical-sfhs

on:
  pull_request:
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: cat-paw-canonical-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: |
          git clone --no-checkout https://github.com/falloutmule/single-file-html-software.git "$RUNNER_TEMP/sfhs"
          git -C "$RUNNER_TEMP/sfhs" fetch --depth=1 origin 68ef8f021eea2ab90a57ca6e2f608d8166a39859
          git -C "$RUNNER_TEMP/sfhs" checkout --detach FETCH_HEAD
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm --dir "$RUNNER_TEMP/sfhs" install --frozen-lockfile
      - run: |
          node --experimental-strip-types tests/input-lifecycle.ts
          node --experimental-strip-types tests/scenarios.ts
          node --experimental-strip-types tests/match-flow.ts
          node --experimental-strip-types tests/orientation-layout.ts
      - run: |
          cd "$RUNNER_TEMP/sfhs"
          pnpm sfhs one-shot graduate materialize --project "$GITHUB_WORKSPACE" --json
      - run: |
          project="$(find "$RUNNER_TEMP/sfhs/examples" -maxdepth 1 -type d -name '.sfhs-grad-cat-paw-air-hockey-*' | head -n 1)"
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs inspect --json --project "$project"
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs validate --json --project "$project"
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs pack --json --project "$project"
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs verify --json --project "$project"
