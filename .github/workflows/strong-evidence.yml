name: strong-evidence

on:
  workflow_dispatch:

concurrency:
  group: cat-paw-strong-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm test
      - name: Rebuild, verify, and retain packed browser evidence
        run: |
          pin=$(node -p "require('./one-shot/SFHS-PIN.json').sfhsCommit")
          git clone --no-checkout https://github.com/falloutmule/single-file-html-software.git "$RUNNER_TEMP/sfhs"
          git -C "$RUNNER_TEMP/sfhs" fetch --depth=1 origin "$pin"
          git -C "$RUNNER_TEMP/sfhs" checkout --detach FETCH_HEAD
          pnpm --dir "$RUNNER_TEMP/sfhs" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs one-shot graduate materialize --project "$GITHUB_WORKSPACE" --json
          project=$(find "$RUNNER_TEMP/sfhs/examples" -maxdepth 1 -type d -name '.sfhs-grad-cat-paw-air-hockey-*' | head -n 1)
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs pack --json --project "$project"
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs verify --json --project "$project"
          pnpm --dir "$RUNNER_TEMP/sfhs/packages/browser-runner" exec playwright install --with-deps chromium
          SFHS_PLAYWRIGHT_RESOLVER="$RUNNER_TEMP/sfhs/packages/browser-runner/package.json" SFHS_BROWSER_REPORT="$project/test-results/canonical-browser.json" pnpm --dir "$project" test:browser
          echo "CAT_PAW_SFHS_PROJECT=$project" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: cat-paw-strong-browser-evidence
          path: ${{ env.CAT_PAW_SFHS_PROJECT }}/test-results/
          retention-days: 14
          if-no-files-found: error
