name: Clean migration-only workflows

on:
  push:
    branches:
      - codex/sfhs-github-migration
    paths:
      - .github/workflows/cleanup-migration-workflows.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sfhs-github-migration
          fetch-depth: 0

      - name: Remove one-time migration workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/bind-canonical-evidence.yml \
            .github/workflows/strong-evidence-once.yml \
            .github/workflows/cleanup-migration-workflows.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'ci: remove migration-only workflows [skip ci]'
          git push origin HEAD:codex/sfhs-github-migration
