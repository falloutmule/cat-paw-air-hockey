name: quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: cat-paw-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:source
      - name: Materialize the pinned SFHS project
        shell: bash
        run: |
          pin=$(node -p "require('./one-shot/SFHS-PIN.json').sfhsCommit")
          git clone --no-checkout https://github.com/falloutmule/single-file-html-software.git "$RUNNER_TEMP/sfhs"
          git -C "$RUNNER_TEMP/sfhs" fetch --depth=1 origin "$pin"
          git -C "$RUNNER_TEMP/sfhs" checkout --detach FETCH_HEAD
          pnpm --dir "$RUNNER_TEMP/sfhs" install --frozen-lockfile
          pushd "$RUNNER_TEMP/sfhs"
          node packages/cli/src/main.ts one-shot inspect --project "$GITHUB_WORKSPACE" --json
          GITHUB_SHA="$pin" node packages/cli/src/main.ts one-shot graduate materialize --project "$GITHUB_WORKSPACE" --json
          popd
          project=$(find "$RUNNER_TEMP/sfhs/examples" -maxdepth 1 -type d -name '.sfhs-grad-cat-paw-air-hockey-*' | head -n 1)
          test -n "$project"
          echo "CAT_PAW_SFHS_PROJECT=$project" >> "$GITHUB_ENV"
      - name: Install Chromium
        run: pnpm --dir "$RUNNER_TEMP/sfhs/packages/browser-runner" exec playwright install --with-deps chromium
      - name: Verify source and canonical artifact
        shell: bash
        run: |
          pnpm --dir "$CAT_PAW_SFHS_PROJECT" run lint
          pnpm --dir "$CAT_PAW_SFHS_PROJECT" run typecheck
          pnpm --dir "$CAT_PAW_SFHS_PROJECT" test
          pushd "$RUNNER_TEMP/sfhs"
          node packages/cli/src/main.ts one-shot graduate audit --project "$CAT_PAW_SFHS_PROJECT" --json
          node packages/cli/src/main.ts inspect --project "$CAT_PAW_SFHS_PROJECT" --json
          node packages/cli/src/main.ts validate --project "$CAT_PAW_SFHS_PROJECT" --json
          node packages/cli/src/main.ts pack --project "$CAT_PAW_SFHS_PROJECT" --json
          node packages/cli/src/main.ts verify --project "$CAT_PAW_SFHS_PROJECT" --json
          node packages/cli/src/main.ts one-shot audit --project "$CAT_PAW_SFHS_PROJECT" --json
          popd
      - name: One-file browser boot smoke
        run: SFHS_PLAYWRIGHT_RESOLVER="$RUNNER_TEMP/sfhs/packages/browser-runner/package.json" pnpm --dir "$CAT_PAW_SFHS_PROJECT" test:ci-browser
