name: quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cat-paw-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Materialize exact SFHS workspace
        run: |
          pin=$(node -p "require('./one-shot/SFHS-PIN.json').sfhsCommit")
          git clone --no-checkout https://github.com/falloutmule/single-file-html-software.git "$RUNNER_TEMP/sfhs"
          git -C "$RUNNER_TEMP/sfhs" fetch --depth=1 origin "$pin"
          git -C "$RUNNER_TEMP/sfhs" checkout --detach FETCH_HEAD
          pnpm --dir "$RUNNER_TEMP/sfhs" install --frozen-lockfile
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs one-shot inspect --project "$GITHUB_WORKSPACE" --json
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs one-shot graduate materialize --project "$GITHUB_WORKSPACE" --json
          project=$(find "$RUNNER_TEMP/sfhs/examples" -maxdepth 1 -type d -name '.sfhs-grad-cat-paw-air-hockey-*' | head -n 1)
          test -n "$project"
          echo "CAT_PAW_SFHS_PROJECT=$project" >> "$GITHUB_ENV"
      - name: Canonical SFHS gates
        run: |
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha || github.event.before }}" "$GITHUB_SHA" -- || true)
          args=()
          while IFS= read -r path; do [ -z "$path" ] || args+=(--changed "$path"); done <<< "$changed"
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs inspect --json --project "$CAT_PAW_SFHS_PROJECT"
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs validate --json --project "$CAT_PAW_SFHS_PROJECT"
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs check --json --project "$CAT_PAW_SFHS_PROJECT" "${args[@]}"
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs pack --json --project "$CAT_PAW_SFHS_PROJECT"
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs verify --json --project "$CAT_PAW_SFHS_PROJECT"
          pnpm --dir "$RUNNER_TEMP/sfhs" sfhs one-shot audit --project "$CAT_PAW_SFHS_PROJECT" --json
      - name: Packed-artifact browser smoke
        run: |
          pnpm --dir "$RUNNER_TEMP/sfhs/packages/browser-runner" exec playwright install --with-deps chromium
          SFHS_PLAYWRIGHT_RESOLVER="$RUNNER_TEMP/sfhs/packages/browser-runner/package.json" SFHS_BROWSER_REPORT="$CAT_PAW_SFHS_PROJECT/test-results/canonical-browser.json" pnpm --dir "$CAT_PAW_SFHS_PROJECT" test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-paw-browser-evidence
          path: ${{ env.CAT_PAW_SFHS_PROJECT }}/test-results/
          retention-days: 7
          if-no-files-found: ignore
