name: Persist reported-device release result

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  persist:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for and persist evaluation comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- cat-paw-release-evaluation -->';
            let comment;
            for (let attempt = 0; attempt < 24; attempt += 1) {
              const response = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100
              });
              comment = [...response.data].reverse().find((item) => item.body?.includes(marker));
              if (comment) break;
              await new Promise((resolve) => setTimeout(resolve, 10000));
            }
            const head = context.payload.pull_request.head;
            const path = 'docs/physical-acceptance/RELEASE-PREPARE-RESULT.md';
            const body = comment
              ? [
                  '# Exact Galaxy S21 Ultra reported-pass release evaluation',
                  '',
                  `Persisted from PR comment ${comment.html_url}.`,
                  '',
                  comment.body.replace(marker, '').trim(),
                  '',
                  `PR head evaluated: \`${head.sha}\`.`,
                  '',
                  'Merge: NOT PERFORMED',
                  'Release: NOT PERFORMED',
                  'Pages deployment: NOT PERFORMED',
                  ''
                ].join('\n')
              : [
                  '# Exact Galaxy S21 Ultra reported-pass release evaluation',
                  '',
                  'Status: BLOCKED',
                  '',
                  'The durable evaluation comment was not produced within four minutes.',
                  `PR head: \`${head.sha}\`.`,
                  ''
                ].join('\n');
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: head.ref
              });
              if (!Array.isArray(existing.data)) existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch: head.ref,
              message: 'docs: persist exact-device release evaluation result',
              content: Buffer.from(body, 'utf8').toString('base64'),
              ...(existingSha ? { sha: existingSha } : {})
            });
