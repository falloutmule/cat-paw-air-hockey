name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cat-paw-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_sha256: ${{ steps.identity.outputs.sha256 }}
      artifact_bytes: ${{ steps.identity.outputs.bytes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Materialize exact SFHS workspace
        shell: bash
        run: |
          pin=$(node -p "require('./one-shot/SFHS-PIN.json').sfhsCommit")
          git clone --no-checkout https://github.com/falloutmule/single-file-html-software.git "$RUNNER_TEMP/sfhs"
          git -C "$RUNNER_TEMP/sfhs" fetch --depth=1 origin "$pin"
          git -C "$RUNNER_TEMP/sfhs" checkout --detach FETCH_HEAD
          pnpm --dir "$RUNNER_TEMP/sfhs" install --frozen-lockfile
          pushd "$RUNNER_TEMP/sfhs"
          node packages/cli/src/main.ts one-shot inspect --project "$GITHUB_WORKSPACE" --json
          node packages/cli/src/main.ts one-shot graduate materialize --project "$GITHUB_WORKSPACE" --json
          popd
          project=$(find "$RUNNER_TEMP/sfhs/examples" -maxdepth 1 -type d -name '.sfhs-grad-cat-paw-air-hockey-*' | head -n 1)
          test -n "$project"
          echo "CAT_PAW_SFHS_PROJECT=$project" >> "$GITHUB_ENV"
      - name: Install pinned Chromium
        run: pnpm --dir "$RUNNER_TEMP/sfhs/packages/browser-runner" exec playwright install --with-deps chromium
      - name: Canonical SFHS gates
        shell: bash
        run: |
          pnpm --dir "$CAT_PAW_SFHS_PROJECT" test
          pushd "$RUNNER_TEMP/sfhs"
          node packages/cli/src/main.ts one-shot inspect --project "$CAT_PAW_SFHS_PROJECT" --json
          node packages/cli/src/main.ts inspect --project "$CAT_PAW_SFHS_PROJECT" --json
          node packages/cli/src/main.ts validate --project "$CAT_PAW_SFHS_PROJECT" --json
          SFHS_PLAYWRIGHT_RESOLVER="$RUNNER_TEMP/sfhs/packages/browser-runner/package.json" node packages/cli/src/main.ts check --project "$CAT_PAW_SFHS_PROJECT" --json
          node packages/cli/src/main.ts pack --project "$CAT_PAW_SFHS_PROJECT" --json
          node packages/cli/src/main.ts verify --project "$CAT_PAW_SFHS_PROJECT" --json
          node packages/cli/src/main.ts one-shot audit --project "$CAT_PAW_SFHS_PROJECT" --json
          popd
      - name: Packed-artifact browser smoke
        run: SFHS_PLAYWRIGHT_RESOLVER="$RUNNER_TEMP/sfhs/packages/browser-runner/package.json" SFHS_BROWSER_REPORT="$CAT_PAW_SFHS_PROJECT/test-results/canonical-browser.json" pnpm --dir "$CAT_PAW_SFHS_PROJECT" test:browser
      - id: identity
        name: Record verified artifact identity
        shell: bash
        run: |
          artifact="$CAT_PAW_SFHS_PROJECT/dist/index.html"
          echo "sha256=$(sha256sum "$artifact" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "bytes=$(wc -c < "$artifact" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/pages"
          cp "$artifact" "$RUNNER_TEMP/pages/index.html"
          touch "$RUNNER_TEMP/pages/.nojekyll"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # First-time Pages provisioning can remain queued beyond the action's
          # default ten-minute wait; this does not relax any build gate.
          timeout: 1200000
      - name: Verify deployed bytes match the verified artifact
        shell: bash
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.artifact_sha256 }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 3 --retry-delay 5 "$PAGE_URL" --output deployed-index.html
          actual=$(sha256sum deployed-index.html | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA256"
          printf 'Verified deployed SHA-256: %s\n' "$actual" >> "$GITHUB_STEP_SUMMARY"
