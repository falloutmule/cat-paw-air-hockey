name: Restore complete Cat Paw migration on bootstrap main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: github.repository == 'falloutmule/cat-paw-air-hockey'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Restore authoritative source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .remote-restore2 ]; then
            echo "Authoritative source is already restored."
            exit 0
          fi
          cat .remote-restore2/part-* | base64 --decode > /tmp/source.tar.xz
          echo "958201c82e1022e9277a0631903fe167bc3fa533f8e75a16f53b04fb0d747bad  /tmp/source.tar.xz" | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/source.tar.xz -C .
          git config user.name "OpenAI Codex Migration"
          git config user.email "codex-migration@users.noreply.github.com"
          git add -A
          git commit -m "feat: restore complete SFHS migration and bind device report"
          git push origin HEAD:main
